<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADSwift — Release Notes</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --accent: #0071e3;
  --rule: rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1d1f;
    --fg: #f5f5f7;
    --muted: #a1a1a6;
    --accent: #2997ff;
    --rule: rgba(255,255,255,0.12);
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 32px 96px;
}
h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 32px; }
.intro { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ADSwift — Release Notes</h1>
  <p class="intro">Release notes will appear here once the first version ships.</p>
</main>
</body>
</html>
